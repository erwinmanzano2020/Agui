name: Development workflow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test .ai-development/checks/workflow-cases.mjs
      - run: node project.mjs check
      - run: node project.mjs render
      - run: git diff --exit-code -- .ai-development/STATUS.md
